[package]
name = "lolping-lite"
version = "0.1.0"
edition = "2021"
description = "Ultra-light League of Legends-style desktop ping / emote wheel (Rust rewrite)"
license = "MIT"
repository = "https://github.com/Icy-Cat/lolping-lite"
readme = "README.md"
build = "build.rs"
keywords = ["lol", "ping", "overlay", "egui"]
categories = ["gui"]

[lib]
name = "lolping_lite"
path = "src/lib.rs"

[[bin]]
name = "lolping-lite"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", default-features = true }
env_logger = "0.11"
hex = "0.4"
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
log = "0.4"
rand = "0.8"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rodio = { version = "0.19", features = ["wav", "vorbis", "symphonia-all"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2"
base64 = "0.22"
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
k256 = { version = "0.13", features = ["schnorr"] }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
macos-accessibility-client = "0.0.2"


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.release-fast]
inherits = "release"
opt-level = 3
