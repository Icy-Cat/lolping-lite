[package]
name = "lolping-lite"
version = "0.1.0"
edition = "2021"
description = "Ultra-light League of Legends-style desktop ping / emote wheel (Rust rewrite)"
license = "MIT"
repository = "https://github.com/Icy-Cat/lolping-lite"
readme = "README.md"
keywords = ["lol", "ping", "overlay", "egui"]
categories = ["gui"]

[dependencies]
anyhow = "1.0"
eframe = { version = "0.32", default-features = true }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.release-fast]
inherits = "release"
opt-level = 3
